[package]
name = "qiskit-transpiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "qiskit_transpiler"
doctest = false

[lints]
workspace = true

[dependencies]
rayon.workspace = true
rayon-cond = "0.4.0"
numpy.workspace = true
foldhash.workspace = true
itertools.workspace = true
nalgebra.workspace = true
rand.workspace = true
rand_pcg.workspace = true
num-complex.workspace = true
rustworkx-core.workspace = true
qiskit-circuit.workspace = true
qiskit-synthesis.workspace = true
qiskit-quantum-info.workspace = true
qiskit-util = { workspace = true, features = ["py"] }
thiserror.workspace = true
bytemuck.workspace = true
fixedbitset.workspace = true
anyhow.workspace = true
thread_local = "1.1"

[dependencies.uuid]
workspace = true
features = ["v4", "fast-rng"]

[dependencies.smallvec]
workspace = true
features = ["union"]

[dependencies.pyo3]
workspace = true
features = ["hashbrown", "indexmap", "num-complex", "num-bigint", "smallvec"]

[dependencies.ndarray]
workspace = true
features = ["rayon", "approx"]

[dependencies.approx]
workspace = true
features = ["num-complex"]

[dependencies.hashbrown]
workspace = true
features = ["rayon"]

[dependencies.indexmap]
workspace = true
features = ["rayon"]

[features]
cache_pygates = [
    "qiskit-circuit/cache_pygates",
    "qiskit-synthesis/cache_pygates",
]
