name: Compare C ABI

on:
  pull_request:
    # paths:
    #   - "crates/cext/**"
    #   - "crates/bindgen/**"
    #   - "crates/bindgen-cli/**"

jobs:
  abidiff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: checkout main
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}


      - name: build main
        run: |
          make cheader clib-dev
          mv dist/c/lib/libqiskit.so dist/c/lib/libqiskit.so.main

      - name: checkout current
        uses: actions/checkout@v7
        with:
          clean: false

      - name: build current
        run: make cheader clib-dev

      - name: install abi tools
        run: |
          sudo apt update
          sudo apt install -y abigail-tools

      - name: compare abi
        continue-on-error: true
        run: abidiff dist/c/lib/libqiskit.so.main dist/c/lib/libqiskit.so
