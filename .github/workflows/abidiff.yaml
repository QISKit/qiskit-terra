name: Compare C ABI

on:
  pull_request:
    # paths:
    #   - "crates/cext/**"
    #   - "crates/bindgen/**"
    #   - "crates/bindgen-cli/**"

jobs:
  abidiff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Fetch current
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build current
        run: |
          make cheader clib-dev
          mv dist/c/lib/libqiskit.so dist/c/lib/libqiskit.so.main

      - name: Fetch changes
        uses: actions/checkout@v7
        with:
          clean: false

#       - name: install abi tools
#         run: |
#           sudo apt update
#           sudo apt install -y abigail-tools
#
      - name: Build changes
        run: make cheader clib-dev

      - name: Compare ABI
        run: abidiff dist/c/lib/libqiskit.so.main dist/c/lib/libqiskit.so
