name: Compare C ABI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  abidiff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: base checkout
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}


      - name: base build
        run: |
          make cheader clib-dev
          mv dist/c/lib/libqiskit.so dist/c/lib/libqiskit.so.main

      - name: checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: build
        run: make cheader clib-dev

      - name: install abi tools
        run: |
          sudo apt update
          sudo apt install -y abigail-tools

      - name: compare abi
        continue-on-error: true
        run: abidiff dist/c/lib/libqiskit.so.main dist/c/lib/libqiskit.so
