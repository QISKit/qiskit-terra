name: Compare C ABI

on:
  pull_request:
    # paths:
    #   - "crates/cext/**"
    #   - "crates/bindgen/**"
    #   - "crates/bindgen-cli/**"

jobs:
  abidiff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Load cache
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch current
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build current
        run: |
          make cheader clib-dev
          mv dist/c/lib/libqiskit.so dist/c/lib/libqiskit.so.main

      - name: Fetch changes
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Build changes
        run: make cheader clib-dev

      - name: Install ABI tools
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y abigail-tools

      - name: Compare ABI
        run: abidiff dist/c/lib/libqiskit.so.main dist/c/lib/libqiskit.so
