name: Build release artifacts
on:
  workflow_call:
    inputs:
      default-action:
        description: >-
          The default action for each artifact.
          Choose from 'build' (default) or 'skip'.
        type: string
        default: "build"
        required: false

      sdist:
        description: >-
          The action to take for the sdist.
          Choose from 'default', 'build' or 'skip'.
        type: string
        default: "default"
        required: false

      wheels-tier-1:
        description: >-
          The action to take for Tier 1 wheels.
          Choose from 'default', 'build' or 'skip'.
          This builds multiple artifacts, which all match 'wheels-tier-1-*'.
        type: string
        default: "default"
        required: false

      wheels-linux-s390x:
        description: >-
          The action to take for Linux s390x wheels.
          Choose from 'default', 'build' or 'skip'.
        type: string
        default: "default"
        required: false

      wheels-macos-intel:
        description: >-
          The action to take for macOS x86_64 wheels.
          Choose from 'default', 'build', or 'skip'.
        type: string
        default: "default"
        required: false

      wheels-linux-ppc64le:
        description: >-
          The action to take for Linux ppc64le wheels.
          Choose from 'default', 'build' or 'skip'.
        type: string
        default: "default"
        required: false

      artifact-prefix:
        description: "A prefix to give all artifacts uploaded with 'actions/upload-artifact'."
        type: string
        default: ""
        required: false

      python-version:
        description: "The Python version to use to host the build runner."
        type: string
        default: "3.14"
        required: false

      pgo:
        description: "Whether to enable profile-guided optimizations for supported platforms."
        type: boolean
        default: true
        required: false


jobs:
  config_pre:
    name: "Configure"
    uses: ./.github/workflows/config.yml

  config:
    # We set the Python versions to build and test using our configured values in GitHub Actions,
    # rather than duplicating them into `pyproject.toml`.  Setting `CIBW_PROJECT_REQUIRES_PYTHON`
    # doesn't affect the metadata of the wheel, it just overrides `cibuildwheel`'s detection of
    # which versions of Python are supported.  We use that rather than `CIBW_BUILD` because it's
    # easier to use that as a coarse-grained platform/ABI selector.
    outputs:
      requires-python: ${{ steps.output.outputs.requires-python }}
    needs: [config_pre]
    runs-on: ubuntu-latest
    steps:
      - name: Set requires-python
        id: output
        run: |
          set -eo pipefail
          # Awk: `-F.` and `-vOFS=.` set the input and output field separators, respectively. `$NF`
          # is the last field. This increments the last segment of a `[0-9]+(\.[0-9]+)*` version.
          # If this changes to support pre-releases, change the comment in `config.yml`.
          PYTHON_NEXT=$(echo "$PYTHON_NEW" | awk -F. -vOFS=. '{$NF += 1 ; print}')
          echo "requires-python=>=$PYTHON_OLD,<$PYTHON_NEXT" >> $GITHUB_OUTPUT
        env:
          PYTHON_OLD: ${{ needs.config_pre.outputs.python-old }}
          PYTHON_NEW: ${{ needs.config_pre.outputs.python-new }}

  wheels-tier-1:
    name: "Wheels / Tier 1"
    if: (inputs.wheels-tier-1 == 'default' && inputs.default-action || inputs.wheels-tier-1) == 'build'
    runs-on: ${{ matrix.os }}
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Rust
        run:
          rustup toolchain install stable
            --override
            --profile minimal
            --component llvm-tools-preview
            --no-self-update
      - name: Configure PGO
        shell: bash
        if: inputs.pgo
        # The `$GITHUB_ENV` magic file uses some sort of custom parsing, so the variables shouldn't
        # be quoted like they would be if bash were interpreting them.  You still need to use quotes
        # to avoid word splitting where appropriate in compound environment variables.
        #
        # Beware that the heredoc is configured to expand bash variables, but cibuildwheel has
        # special handling for certain variables (`$PATH`, in particular), so you may need to escape
        # some dollar signs to pass those through to cibuildwheel as variables, or use single quotes
        # to prevent shell expansion.
        run: |
          set -e
          mkdir -p "$PGO_WORK_DIR"
          cat >>"$GITHUB_ENV" <<EOF
          CIBW_INHERIT=environment: append
          CIBW_ENVIRONMENT=RUSTUP_TOOLCHAIN=stable RUSTFLAGS='-Cprofile-use=$PGO_OUT_PATH -Cllvm-args=-pgo-warn-missing-function'
          CIBW_BEFORE_BUILD=bash ./tools/build_pgo.sh $PGO_WORK_DIR $PGO_OUT_PATH
          EOF
        env:
          PGO_WORK_DIR: ${{ github.workspace }}/pgo-data
          PGO_OUT_PATH: ${{ github.workspace }}/merged.profdata

      - name: Install deployment requirements
        run: python3 -m pip install --user -r ./.github/workflows/wheels/requirements.txt
      - name: Run cibuildwheel
        run: python3 -m cibuildwheel
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ needs.config.outputs.requires-python }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: ${{ inputs.artifact-prefix }}wheels-tier-1-${{ matrix.os }}
  wheels-macos-intel:
    name: "Wheels / macOS x86_64"
    if: (inputs.wheels-macos-intel == 'default' && inputs.default-action || inputs.wheels-macos-intel) == 'build'
    runs-on: macos-15-intel
    needs: [config]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Rust
        run: rustup toolchain install 1.98 --override --profile minimal --no-self-update

      - name: Install deployment requirements
        run: python3 -m pip install --user -r ./.github/workflows/wheels/requirements.txt
      - name: Run cibuildwheel
        run: python3 -m cibuildwheel
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ needs.config.outputs.requires-python }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: ${{ inputs.artifact-prefix }}wheels-macos-intel


  wheels-linux-s390x:
    name: "Wheels / Linux s390x"
    if: (inputs.wheels-linux-s390x == 'default' && inputs.default-action || inputs.wheels-linux-s390x) == 'build'
    runs-on: ubuntu-24.04-s390x
    needs: [config]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.98 --override --profile minimal --no-self-update

      - name: Install deployment requirements
        run: python3 -m pip install --user -r ./.github/workflows/wheels/requirements.txt
      - name: Run cibuildwheel
        run: python3 -m cibuildwheel
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ needs.config.outputs.requires-python }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: ${{ inputs.artifact-prefix }}wheels-linux-s390x

  wheels-linux-ppc64le:
    name: "Wheels / Linux ppc64le"
    if: (inputs.wheels-linux-ppc64le == 'default' && inputs.default-action || inputs.wheels-linux-ppc64le) == 'build'
    runs-on: ubuntu-24.04-ppc64le
    needs: [config]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.98 --override --profile minimal --no-self-update

      - name: Install deployment requirements
        run: python3 -m pip install --user -r ./.github/workflows/wheels/requirements.txt
      - name: Run cibuildwheel
        run: python3 -m cibuildwheel
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ needs.config.outputs.requires-python }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: ${{ inputs.artifact-prefix }}wheels-linux-ppc64le

  sdist:
    name: "sdist"
    if: (inputs.sdist == 'default' && inputs.default-action || inputs.sdist) == 'build'
    runs-on: ubuntu-latest
    needs: [config]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build sdist
        run: |
          set -e
          python -m pip install -U build
          python -m build --sdist .
      - uses: actions/upload-artifact@v7
        with:
          path: ./dist/*.tar.gz
          name: ${{ inputs.artifact-prefix }}sdist
