---
features_c:
  - |
    Added :c:func:`qk_circuit_from_openqasm2`, which loads a :c:type:`QkCircuit` from a string
    containing an OpenQASM 2 program.  The importer is written natively in Rust and does not call
    into Python.  Parsing is configured with an opaque :c:type:`QkOpenQasm2Options` handle,
    created by :c:func:`qk_openqasm2_options_new` and configured with
    :c:func:`qk_openqasm2_options_set_strict` and
    :c:func:`qk_openqasm2_options_append_include_path`; it is released with
    :c:func:`qk_openqasm2_options_free`.  The circuit is written through an out-parameter and
    a :c:type:`QkExitCode` reports success or the kind of failure, with a human-readable
    description written to the ``error`` out-parameter and released with :c:func:`qk_str_free`.
    The custom classical functions and custom instructions accepted by ``qiskit.qasm2.loads``
    are not yet supported through C; a program relying on those extensions will fail to parse.
